# Place at /etc/nginx/sites-available/cms-backend.conf on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/cms-backend.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# server_name is set to eiceapi.eicetechnology.com — run certbot for HTTPS
# (see DEPLOYMENT.md).

upstream cms_backend {
    server 127.0.0.1:3011;
}

server {
    listen 80;
    listen [::]:80;
    server_name eiceapi.eicetechnology.com;

    client_max_body_size 15m; # media uploads are capped at 10MB app-side

    location / {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
